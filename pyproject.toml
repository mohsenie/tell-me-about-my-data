[project]
name = "galene"
version = "0.1.0"
description = "Galene: Ask the ocean. Find the shore. — zero-knowledge relational-fingerprinting anomaly discovery over asset telemetry, through chat."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=14",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "dcor>=0.6",
    "pypdf>=4.0",
    "boto3>=1.34",
]

[project.scripts]
# `galene` is the brand command; `ttmd` kept as an alias so existing usage/docs and
# the internal package name (import ttmd) keep working — renaming the import package
# would ripple through every module, env var (TTMD_*), and test.
galene = "ttmd.cli:main"
ttmd = "ttmd.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
