# Source metadata — provided by the USER (customer) at onboarding.
# Declares what each data source is, so field-semantics can be interpreted with
# the right protocol context. The customer knows their equipment; the system
# consumes this. Missing entries -> system falls back to name-only guessing.
#
# protocol examples: J1939, "NMEA 0183", AIS, OBD-II, Modbus, custom
asset_type: ship
sources:
  engine:
    protocol: J1939
    description: Main engine ECU (Volvo Penta DPX-600)
  nmea:
    protocol: NMEA 0183
    description: Navigation / GPS / weather instruments
  ais-own:
    protocol: AIS
    description: Own-ship AIS transponder (ITU-R M.1371)
  ais-other:
    protocol: AIS
    description: AIS reports received from nearby vessels
  vibration:
    protocol: custom
    description: Engine-mounted vibration sensor (accel + edge FFT features)

# Optional place/port list — provided by the USER, used to turn coordinates into
# human place names OFFLINE (no network geocoder). Each: name, lat, lon, and an
# optional radius_km (how close counts as "at" that place; default applies if
# omitted). The system reports the nearest place within range, else raw coords.
places:
  - name: Inverness Marina
    lat: 57.4870
    lon: -4.2530
    radius_km: 5
  - name: Fort William
    lat: 56.8198
    lon: -5.1052
    radius_km: 5
  - name: Kessock Bridge
    lat: 57.5030
    lon: -4.2360
    radius_km: 3
